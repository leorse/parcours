<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Mer Méditerranée -->
  <rect width="200" height="150" fill="#87CEEB"/>
  <!-- Gaule -->
  <rect x="0" y="0" width="54" height="50" fill="#90c890" rx="3"/>
  <text x="27" y="29" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#2d5a2d" font-weight="bold">Gaule</text>
  <!-- Péninsule ibérique -->
  <rect x="0" y="50" width="40" height="45" fill="#c8a460" rx="3"/>
  <text x="20" y="76" text-anchor="middle" font-size="7" font-family="sans-serif" fill="#6b4f1a">Ibérie</text>
  <!-- Italie (péninsule) -->
  <polygon points="80,20 95,20 100,90 85,95 75,80" fill="#e8a060"/>
  <text x="87" y="52" text-anchor="middle" font-size="7" font-family="sans-serif" fill="#6b3010" font-weight="bold">Italie</text>
  <!-- Grèce -->
  <polygon points="110,30 140,28 145,65 120,70" fill="#c890e0"/>
  <text x="127" y="50" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#4b1580" font-weight="bold">Grèce</text>
  <!-- Égypte -->
  <rect x="140" y="80" width="60" height="60" fill="#e8d060" rx="3"/>
  <text x="170" y="112" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#6b5a10" font-weight="bold">Égypte</text>
  <!-- Afrique du Nord -->
  <rect x="40" y="110" width="100" height="40" fill="#d4b080" rx="3"/>
  <text x="90" y="132" text-anchor="middle" font-size="7" font-family="sans-serif" fill="#6b4f1a">Afrique du Nord</text>
  <!-- Mer intérieure label -->
  <text x="95" y="95" text-anchor="middle" font-size="7" font-family="sans-serif" fill="#3a7fb5" font-style="italic">Méditerranée</text>
</svg>
