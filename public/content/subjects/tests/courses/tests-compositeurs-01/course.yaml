      content:
        - type: md
          text: |
            ## Les grands compositeurs classiques

            Quatre grands noms dominent la musique classique :
            - **Vivaldi** (1678–1741) — *Les Quatre Saisons*
            - **Bach** (1685–1750) — *Le Clavier bien tempéré*
            - **Mozart** (1756–1791) — *La Flûte enchantée*
            - **Beethoven** (1770–1827) — *La Cinquième Symphonie*
