    # ───────────────────────────────────────
    # GE4 — Leçon 4.1 : PGCD
    # ───────────────────────────────────────
    - id: "lec-pgcd-001"
      content:
        - type: md
          text: |
            ## Le Plus Grand Commun Diviseur (PGCD)

            Link veut faire des **trousses d'aventurier** avec ses flèches et bombes,
            en répartissant tout sans rien gâcher. Le **PGCD** lui donne le nombre maximum de trousses !

        - type: notice
          style: definition
          title: "Définition — PGCD"
          text: |
            Le **Plus Grand Commun Diviseur** de $a$ et $b$, noté $\text{PGCD}(a, b)$,
            est le plus grand entier qui divise à la fois $a$ et $b$.

        - type: notice
          style: info
          title: "Méthode 1 — Par liste des diviseurs"
          text: |
            1. Trouve tous les diviseurs de $a$
            2. Trouve tous les diviseurs de $b$
            3. Identifie les diviseurs **communs**
            4. Prends le **plus grand**

        - type: notice
          style: example
          title: "Exemple — Link : 48 flèches et 36 bombes"
          text: |
            Diviseurs de $48$ : 1, 2, 3, 4, **6**, 8, **12**, 16, 24, 48

            Diviseurs de $36$ : 1, 2, 3, 4, **6**, 9, **12**, 18, 36

            Diviseurs communs : 1, 2, 3, 4, 6, **12**

            $\text{PGCD}(48, 36) = \mathbf{12}$ → Link peut faire **12 trousses** (4 flèches + 3 bombes chacune)

        - type: notice
          style: info
          title: "Méthode 2 — Par décomposition en facteurs premiers"
          text: |
            $48 = 2^4 \times 3$ et $36 = 2^2 \times 3^2$

            PGCD = produit des facteurs communs avec le **plus petit exposant** :

            $\text{PGCD}(48, 36) = 2^2 \times 3 = 12$ ✅

        - type: exercise
          ref: "exo-pgcd-fitb-001"

    # ───────────────────────────────────────
    # GE4 — Leçon 4.2 : Algorithme d'Euclide
    # ───────────────────────────────────────
    - id: "lec-pgcd-002"
      content:
        - type: md
          text: |
            ## L'algorithme d'Euclide

            Pour de grands nombres, la liste des diviseurs devient trop longue.
            L'**algorithme d'Euclide** permet de calculer le PGCD rapidement !

        - type: notice
          style: info
          title: "Principe de l'algorithme d'Euclide"
          text: |
            $\text{PGCD}(a, b) = \text{PGCD}(b, r)$ où $r$ est le reste de la division de $a$ par $b$.

            On répète jusqu'à obtenir un reste **nul**. Le dernier **diviseur non nul** est le PGCD.

        - type: notice
          style: example
          title: "Exemple — Sonic : 72 anneaux dorés, 60 argentés"
          text: |
            **Étape 1 :** $72 = 1 \times 60 + 12$

            **Étape 2 :** $60 = 5 \times 12 + 0$ ← reste nul !

            Le dernier diviseur non nul est **12**.

            $\text{PGCD}(72, 60) = \mathbf{12}$ ✅

        - type: exercise
          ref: "exo-pgcd-timeline-001"
        - type: exercise
          ref: "exo-pgcd-fitb-002"

    # ───────────────────────────────────────
    # GE4 — Leçon 4.3 : Applications du PGCD
    # ───────────────────────────────────────
    - id: "lec-pgcd-003"
      content:
        - type: md
          text: |
            ## Applications du PGCD

            Le PGCD est utile dans de nombreuses situations : simplifier des fractions,
            résoudre des problèmes de partage, ou déterminer si deux nombres sont premiers entre eux.

        - type: notice
          style: definition
          title: "Nombres premiers entre eux"
          text: |
            Deux entiers $a$ et $b$ sont dits **premiers entre eux** (ou **coprimes**) si $\text{PGCD}(a, b) = 1$.
            Cela **ne signifie pas** que $a$ ou $b$ est un nombre premier !

        - type: notice
          style: example
          title: "Application — Simplifier une fraction avec Mario"
          text: |
            Mario a complété $\frac{36}{84}$ des niveaux du château.

            $\text{PGCD}(36, 84) = 12$

            $\frac{36}{84} = \frac{36 \div 12}{84 \div 12} = \frac{3}{7}$

            La fraction irréductible est $\frac{3}{7}$.

        - type: exercise
          ref: "exo-pgcd-matching-001"
        - type: exercise
          ref: "exo-pgcd-fitb-003"

