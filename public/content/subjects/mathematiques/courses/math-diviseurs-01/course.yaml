    - id: "lec-syn-001"
      content:
        - type: md
          text: |
            ## Révisions croisées

            Il est temps de rassembler toutes tes connaissances !
            PGCD, PPCM, nombres premiers, décomposition… tout est lié.

        - type: notice
          style: info
          title: "Lien entre PGCD et PPCM"
          text: |
            Pour tous entiers $a$ et $b$ :

            $\text{PGCD}(a, b) \times \text{PPCM}(a, b) = a \times b$

        - type: notice
          style: example
          title: "Vérification avec Mario et Luigi"
          text: |
            $a = 4$, $b = 6$

            $\text{PGCD}(4, 6) = 2$ et $\text{PPCM}(4, 6) = 12$

            $2 \times 12 = 24 = 4 \times 6$ ✅

        - type: exercise
          ref: "exo-syn-mc-001"

