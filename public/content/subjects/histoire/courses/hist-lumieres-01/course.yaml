    # ── Leçon 1 : Qu'est-ce que les Lumières ? ────────────────────────────────
    - id: "lec-lum-001"
      content:
        - type: md
          text: |
            ## Le mouvement des Lumières

            Les **Lumières** désignent un mouvement intellectuel du **XVIIIe siècle** (1700–1800).

            Des philosophes, des scientifiques et des écrivains souhaitent **transformer la société** grâce à la raison et à la connaissance. Leur but : remplacer les croyances aveugles et les traditions injustes par la **réflexion critique**.

            > « Le siècle des Lumières » — parce que ces penseurs voulaient « **éclairer** » le plus grand nombre.

        - type: break

        - type: md
