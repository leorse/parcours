    # ── Leçon 2 : Les grands philosophes ─────────────────────────────────────
    - id: "lec-lum-002"
      content:
        - type: md
          text: |
            ## Les grands penseurs des Lumières

            | Philosophe | Nationalité | Idée principale |
            |---|---|---|
            | **Voltaire** | Français | La tolérance religieuse |
            | **Rousseau** | Genevois | L'égalité entre tous les hommes |
            | **Montesquieu** | Français | La séparation des pouvoirs |
            | **Diderot** | Français | La liberté individuelle |
            | **Kant** | Allemand | L'usage de la raison |

            Ils diffusent leurs idées par les **livres**, les **voyages** et les débats dans les cafés et salons.

        - type: break

        - type: md
