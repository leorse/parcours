    # ── Leçon 3 : Politique et société ───────────────────────────────────────
    - id: "lec-lum-003"
      content:
        - type: md
          text: |
            ## La monarchie absolue en question

            En France, le roi concentre **tous les pouvoirs** — exécutif, législatif, judiciaire. Il tient son autorité de Dieu : c'est la **monarchie absolue de droit divin**.

            Les philosophes, notamment **Montesquieu**, réclament une **séparation des pouvoirs** afin qu'aucun homme ne puisse tout contrôler.

        - type: notice
          text: |
            **La société d'ordres**
            La société est divisée en trois ordres :
            - Le **clergé** et la **noblesse** (3 % de la population) ont des privilèges et ne paient pas d'impôts.
            - Le **tiers état** (97 %) — paysans, artisans, bourgeois — supporte seul le poids fiscal.

            **Rousseau** et les autres philosophes exigent la fin de ces inégalités.

        - type: break

        - type: exercise
          ref: "exo-lum-mc-003"

        - type: break

        - type: exercise
          ref: "exo-lum-mc-004"

    # ── Leçon 4 : Tolérance et science ───────────────────────────────────────
    - id: "lec-lum-004"
      content:
        - type: md
          text: |
            ## Tolérance et démarche scientifique

            **Voltaire** défend la **tolérance religieuse** : après des siècles de guerres entre catholiques et protestants (comme la Saint-Barthélémy en 1572), il prône le respect des convictions de chacun.

            > « Fais que nous nous aidions mutuellement à supporter le fardeau d'une vie pénible et passagère. »
            > — Voltaire, *Traité sur la Tolérance*, 1763

            Le couple **Lavoisier** illustre l'esprit scientifique des Lumières : émettre des hypothèses et les vérifier par l'expérience — c'est la **démarche hypothético-déductive**. Ils ont notamment travaillé sur les états de l'eau, en **chimie**.

        - type: break

        - type: exercise
          ref: "exo-lum-match-002"

        - type: break

        - type: exercise
          ref: "exo-lum-mc-006"

    # ── Leçon 5 : Diffuser les idées ─────────────────────────────────────────
    - id: "lec-lum-005"
      content:
        - type: md
          text: |
            ## Comment les idées se diffusent

            Sans réseaux sociaux ni télévision, les philosophes utilisent d'autres moyens :

            📖 **L'Encyclopédie** (1751–1772) — dirigée par **Diderot** et d'Alembert — rassemble tout le savoir de l'époque : sciences, arts, philosophie, métiers... Elle est censurée par le roi, mais circule malgré tout en Europe.

            ☕ **Les salons et les cafés** — lieux de réunion où philosophes et scientifiques débattent librement de politique et de société.

            ✈️ **Les voyages** — Diderot se rend en Russie auprès de **Catherine II**, impératrice influencée par les Lumières tout en conservant son pouvoir absolu : un « **despote éclairé** ».

        - type: break

        - type: exercise
          ref: "exo-lum-mc-005"

        - type: break

        - type: exercise
          ref: "exo-lum-fitb-002"

